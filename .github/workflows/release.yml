name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Configure Buildx
        run: docker buildx create --use
      - name: Publish versioned multi-architecture image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="${VERSION#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$image:$version" \
            --tag "$image:latest" \
            --push .
